<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- サイトは最初から暗い配色。ダークモード拡張（Dark Reader）が色を塗り直すとピンクのグラデ文字が黒くなるため、拡張を止める目印（2026-10-14） -->
<meta name="darkreader-lock">
<title>ページが見つかりません｜AIコンサルティング株式会社</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#E72FC2">
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 文字データは裏で読み込み、そろってから1回で切り替える（js/fonts.js）。wght@400..900 は太さの指定をまとめたもので、文字ファイルは前と同じ（2026-11-06） -->
<link id="aic-fonts" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400..900&display=swap" rel="stylesheet" media="print" onload="this.media='all';if(window.aicFontsLoad)aicFontsLoad()">
<script>try{if(sessionStorage.getItem('aicFonts')){document.getElementById('aic-fonts').media='all';document.documentElement.classList.add('fonts-loaded')}}catch(e){}</script>
<script src="/js/fonts.js?v=20261106a" defer></script>
<!-- LINEの中でだけ別タブの指定を外す（2026-11-06） -->
<script src="/js/inapp-links.js?v=20261106a" defer></script>
<link rel="stylesheet" href="/css/style.css?v=20261106b">
<style>
  .nf {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 80px 24px;
    position: relative;
  }
  .nf__num {
    font-size: clamp(120px, 22vw, 240px);
    font-weight: 900;
    line-height: 1;
    background: var(--grad-text);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 24px;
    letter-spacing: -.04em;
  }
  .nf h1 { font-size: clamp(24px, 4vw, 36px); margin-bottom: 16px; }
  .nf p { color: var(--text-soft); margin-bottom: 36px; font-size: 16px; }
</style>
<!-- アクセス解析（IDは js/analytics.js に書く）2026-11-06 -->
<script src="/js/analytics.js?v=20261106a" defer></script>
</head>
<body>
<main>
  <div class="nf container-narrow">
    <div>
      <div class="nf__num">404</div>
      <h1>ページが見つかりません</h1>
      <p>お探しのページは移動または削除された可能性があります。<br>お手数ですが、トップページから目的のページをお探しください。</p>
      <a href="/" class="btn btn-primary">トップページへ戻る <span class="btn-arrow">→</span></a>
    </div>
  </div>
</main>
</body>
</html>
